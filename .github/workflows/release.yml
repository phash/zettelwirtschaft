name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt = Runtime (-r requirements.txt) + pytest/pytest-asyncio
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short -x
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          OLLAMA_BASE_URL: "http://localhost:11434"
          OLLAMA_MODEL: "llama3.2"
          UPLOAD_DIR: "./test_uploads"
          ARCHIVE_DIR: "./test_archive"

  build-images:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          # Benannter Context fuer COPY --from=repo VERSION im Dockerfile
          build-contexts: repo=.
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create release archive
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          REPO=${{ github.repository }}
          mkdir -p release

          # Installer-/Skript-Dateien laut release-manifest.txt kopieren (einzige
          # Liste, erzeugt auch manifest.nsh fuer setup.nsi)
          python3 scripts/release_manifest.py stage release

          # docker-compose.yml: build-Direktiven durch GHCR-Image-Referenzen ersetzen
          # (frontend: mehrzeiliger build-Block inkl. additional_contexts -> eine image-Zeile)
          sed \
            -e "s|build: ./backend|image: ghcr.io/${REPO}/backend:${VERSION}|" \
            -e "/^  frontend:/,/^    ports:/{" \
            -e "/^    build:$/,/^        repo: \.$/c\    image: ghcr.io/${REPO}/frontend:${VERSION}" \
            -e "}" \
            docker-compose.yml > release/docker-compose.yml

          # VERSION-Datei mit aktueller Version schreiben
          echo "${VERSION}" > release/VERSION

          # Archive erstellen (Glob * schliesst Dotfiles aus, daher explizit;
          # manifest.nsh ist nur Build-Input fuer setup.nsi)
          cd release
          tar -czf ../zettelwirtschaft-${VERSION}.tar.gz --exclude=manifest.nsh .env.example *
          zip -r ../zettelwirtschaft-${VERSION}.zip .env.example * -x manifest.nsh

      - name: Install NSIS
        run: sudo apt-get install -y nsis

      - name: Build Setup.exe
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cp setup.nsi release/
          cd release
          makensis -DVERSION=${VERSION} setup.nsi
          mv Zettelwirtschaft-${VERSION}-Setup.exe ../

      - name: Generate changelog
        id: changelog
        run: |
          # Vorheriges Tag finden
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s" HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD)
          fi
          echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Zettelwirtschaft v${{ steps.version.outputs.VERSION }}
          body: |
            ## Zettelwirtschaft v${{ steps.version.outputs.VERSION }}

            ### Aenderungen
            ${{ steps.changelog.outputs.CHANGES }}

            ### Installation

            **Setup.exe (Docker-Variante):**
            1. `Zettelwirtschaft-${{ steps.version.outputs.VERSION }}-Setup.exe` herunterladen
            2. Ausfuehren und den Anweisungen folgen

            **Manuell (ZIP):**
            1. Archiv herunterladen und entpacken
            2. `install.bat` doppelklicken

            **Voraussetzung:** [Docker Desktop](https://www.docker.com/products/docker-desktop/) muss installiert sein.

            ### Docker Images

            ```
            ghcr.io/${{ github.repository }}/backend:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/frontend:${{ steps.version.outputs.VERSION }}
            ```
          files: |
            Zettelwirtschaft-${{ steps.version.outputs.VERSION }}-Setup.exe
            zettelwirtschaft-${{ steps.version.outputs.VERSION }}.tar.gz
            zettelwirtschaft-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
