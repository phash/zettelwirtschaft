# Gemeinsame server-Konfiguration fuer frontend/nginx.conf (HTTP) und
# ssl/nginx-ssl.conf (HTTPS). Das Frontend-Image legt sie unter
# /etc/nginx/snippets/zettelwirtschaft-common.conf ab; beide Server-Bloecke
# binden sie per include ein — so koennen die Konfigurationen nicht mehr
# auseinanderdriften. Nur server-Kontext-Direktiven (kein listen/ssl_*).

root /usr/share/nginx/html;
index index.html;

# Client-IP: KEIN real_ip-Modul. Ein vom Client mitgeschickter
# X-Forwarded-For/X-Real-IP wird nie uebernommen — sonst koennte jeder
# LAN-Client seine IP frei waehlen und den PIN-Brute-Force-Lockout umgehen.
# Das Backend bekommt unten immer die echte Socket-Adresse ($remote_addr).

# Security Headers
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'" always;

# API proxy to backend. ^~: hat Vorrang vor den Regex-Locations unten — sonst
# wuerde z.B. DELETE /api/documents/<id>/tags/logo.png als statische Datei
# behandelt.
location ^~ /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # AVAIL-01: JSON-Bodies klein halten — das Backend parst sie komplett
    # (json.loads) vor Rate-Limit und Schema-Pruefung. Gleicher Wert wie
    # DEFAULT_MAX_BODY_BYTES in app/core/request_limits.py. Datei-Uploads haben
    # unten eine eigene location mit der grossen Grenze.
    client_max_body_size 256k;

    # Lange Vorgaenge (Re-Analyse, E-Mail-Abruf, Backup) laufen als
    # Hintergrund-Vorgaenge mit Polling; 120 s reichen fuer die Analyse-Uploads.
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
}

# Datei-Upload (einzige Multipart-Route, = UPLOAD_PATHS im Backend). Exakter
# Treffer hat Vorrang vor ^~ /api/. Upload-Limit: MAX_UPLOAD_SIZE_MB (50) +
# Puffer fuer Multipart-Overhead — gleicher Wert wie die Backend-Grenze
# (app/core/request_limits.py). proxy_pass ohne URI = Original-URI unveraendert.
location = /api/documents/upload {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 55M;

    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
}

# Gehashte Build-Artefakte (Vite /assets/*, workbox-<hash>.js): Inhalt aendert
# sich nie unter demselben Namen -> 1 Jahr immutable.
location ^~ /assets/ {
    # add_header in einer location hebt sonst ALLE Security-Header der
    # server-Ebene auf (nginx-Vererbungsregel). merge = server-Header + eigene
    # (nginx >= 1.29.3).
    add_header_inherit merge;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location ~ ^/workbox-[0-9a-f]+\.js$ {
    add_header_inherit merge;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Service Worker darf nicht gecacht werden (sonst klemmt das PWA-Update).
location = /sw.js {
    add_header_inherit merge;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
}

# Alles andere (index.html, registerSW.js, manifest, favicon, SPA-Routen) hat
# keinen Hash im Namen -> immer revalidieren, sonst haengen Clients nach einem
# Update auf alten Dateien fest.
location / {
    add_header_inherit merge;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}

# Gzip
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/manifest+json image/svg+xml;
gzip_min_length 1000;
