# SSL-/HTTPS-Erweiterung fuer Zettelwirtschaft (selbstsigniertes LAN-Zertifikat).
#
# Zweck: ermoeglicht den Smartphone-Scan (Kamera-API) und den PWA-Service-Worker
# im Heim-WLAN — beide verlangen einen Secure Context (HTTPS oder localhost).
#
# Voraussetzung: einmalig das Zertifikat erzeugen (legt ssl/cert.pem + key.pem an):
#     bash ssl/generate-cert.sh
#   oder (Windows, Python mit "cryptography"):
#     python ssl\generate-self-signed-cert.py
#
# Start: einfach start.bat. Sobald ssl\cert.pem + ssl\key.pem existieren, setzt
# generate-mounts.ps1 COMPOSE_FILE in .env auf docker-compose.yml +
# docker-compose.ssl.yml (+ Override). Damit bleibt HTTPS bei JEDEM
# compose-Aufruf aktiv (start/stop/update, auch manuell). Zum Abschalten die
# beiden .pem-Dateien loeschen und start.bat erneut ausfuehren.
# Ohne die Windows-Skripte: docker compose -f docker-compose.yml -f docker-compose.ssl.yml up -d
#
# Danach am Smartphone https://<server-ip>/ oeffnen und die einmalige
# Browser-Warnung (selbstsigniertes Zertifikat) akzeptieren.

services:
  frontend:
    # nginx-Master als root: bindet 80/443 und liest den owner-only (0600) Key.
    # Die Worker (die den Netzwerkverkehr bedienen) laufen weiterhin als non-root
    # nginx (user-Direktive der stock nginx.conf, greift nur bei root-Master) —
    # Standard-TLS-Modell, gleiches Vorgehen wie praxiszeit.
    user: root
    # Die Basis droppt ALLE Caps. Fuer den root-Master werden GENAU die noetigen
    # zurueckgegeben: NET_BIND_SERVICE (Port 80/443), DAC_OVERRIDE (0600-Key +
    # nginx-Cache lesen/schreiben), SETUID/SETGID (Worker auf nginx droppen),
    # CHOWN. Ohne sie crasht der Container beim Start (mkdir/bind: permission
    # denied). no-new-privileges der Basis bleibt aktiv (verhindert SUID-Eskalation).
    cap_add:
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - CHOWN
    # !override ersetzt das Port-Mapping der Basis (FRONTEND_PORT -> 8080), statt
    # es zu ergaenzen: nginx-ssl.conf lauscht nur auf 80/443, ein veroeffentlichter
    # 8080-Port waere tot.
    ports: !override
      - "80:80"     # HTTP -> 301 Redirect auf HTTPS
      - "443:443"   # HTTPS
    volumes:
      - ./ssl/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./ssl/key.pem:/etc/nginx/ssl/key.pem:ro
