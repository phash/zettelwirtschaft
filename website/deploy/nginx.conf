# Zettelwirtschaft static site — served behind caddy-proxy (TLS + security headers at Caddy).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Real client IP comes from Caddy on the docker network.
    # Security headers + CSP are applied centrally by Caddy.

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;

    # Block dotfiles (except ACME/well-known if ever needed at this layer)
    location ~ /\.(?!well-known) { deny all; }

    # Self-hosted fonts + immutable-ish assets: long cache
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Download artifacts: range requests for resumable downloads; modest cache
    location /downloads/ {
        expires 1h;
        add_header Cache-Control "public";
        types {
            application/gzip tar.gz gz;
            application/zip zip;
            text/plain txt;
        }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    # Multi-page static site: serve file, then directory index, else 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Lightweight 404 -> home is overkill for a static site; return 404 normally.
}
