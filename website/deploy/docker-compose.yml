# Zettelwirtschaft — statische Präsentations- und Download-Website
# Wird vom zentralen caddy-proxy reverse-proxied (Upstream: zettelwirtschaft-web:80).
# Nur die Website (HTML + Downloads) — NICHT die Anwendung selbst (die ist lokal/on-premise).
services:
  web:
    image: nginx:1.27-alpine
    container_name: zettelwirtschaft-web
    restart: unless-stopped
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - caddy-proxy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 96M

networks:
  caddy-proxy:
    external: true
