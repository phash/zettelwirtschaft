# Zettelwirtschaft — nginx mit HTTPS (selbstsigniertes LAN-Zertifikat).
# Wird ueber docker-compose.ssl.yml als default.conf in den Frontend-Container
# gemountet. Non-root nginx -> nicht-privilegierte Ports 8080 (HTTP) + 8443
# (HTTPS); das Host-Port-Mapping (80->8080, 443->8443) macht docker compose.

# HTTP -> HTTPS Redirect ($host ohne Port -> Standard-443)
server {
    listen 8080;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # F-12: X-Real-IP nur aus privaten Subnetzen akzeptieren.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Security Headers (inkl. HSTS — die App laeuft jetzt ueber HTTPS)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'" always;

    # Service Worker darf nicht gecacht werden (sonst klemmt das PWA-Update)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA routing - all non-file routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend (X-Forwarded-Proto=https -> Secure-Cookie + HTTPS-Erkennung)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 50M;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/manifest+json image/svg+xml;
    gzip_min_length 1000;
}
