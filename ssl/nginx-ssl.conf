# Zettelwirtschaft — nginx mit HTTPS (selbstsigniertes LAN-Zertifikat).
# Wird ueber docker-compose.ssl.yml als default.conf in den Frontend-Container
# gemountet. Der nginx-MASTER laeuft dort als root (bindet 80/443 + liest den
# 0600-Key), die WORKER laufen weiterhin als non-root nginx (user-Direktive in
# /etc/nginx/nginx.conf) — Standard-TLS-Modell.

# HTTP -> HTTPS Redirect ($host ohne Port -> Standard-443)
server {
    listen 80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # Nur Forward-Secrecy-Suiten mit AEAD (TLS 1.3 waehlt seine Suiten selbst).
    ssl_ciphers         ECDHE+AESGCM:ECDHE+CHACHA20;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS bewusst kurz und OHNE includeSubDomains: bei einem selbstsignierten
    # LAN-Cert (oft per IP angesprochen) bringt ein langes includeSubDomains-
    # Pinning nichts und kann bei Cert-Wechsel/IP-Aenderung (DHCP) Geschwister-
    # Hosts hart aussperren. Browser honorieren HSTS ueber ein nicht
    # vertrauenswuerdiges Cert ohnehin nur eingeschraenkt.
    add_header Strict-Transport-Security "max-age=300" always;

    # Gemeinsame Regeln (Security-Header, API-Proxy inkl. X-Forwarded-Proto ->
    # Secure-Cookie, Caching, Gzip) — identisch mit frontend/nginx.conf, Quelle:
    # frontend/nginx-common.conf (im Frontend-Image unter /etc/nginx/snippets/).
    include /etc/nginx/snippets/zettelwirtschaft-common.conf;
}
