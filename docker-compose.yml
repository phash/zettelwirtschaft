services:
  backend:
    build: ./backend
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      ollama:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    # Defense-in-Depth: keine zusaetzlichen Privilegien, alle Capabilities weg.
    # appuser laeuft sowieso als non-root (siehe backend/Dockerfile).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  chromadb:
    image: chromadb/chroma:0.6.3
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    # nginx laeuft seit N-006 als USER nginx und listen 8080 — keine Caps
    # mehr noetig.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  ollama-models:
  chromadb-data:
