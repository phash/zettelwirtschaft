services:
  backend:
    build: ./backend
    expose:
      - "8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    depends_on:
      ollama:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    # B4: Backend ist in zwei Netzen — public (default) fuer nginx, und das
    # interne chromadb-net fuer den Embedding-Store. Andere Container im
    # default-Netz koennen ChromaDB damit nicht erreichen.
    networks:
      - default
      - chromadb-net
    restart: unless-stopped
    # Defense-in-Depth: keine zusaetzlichen Privilegien, alle Capabilities weg.
    # appuser laeuft sowieso als non-root (siehe backend/Dockerfile).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # NEW-006: kein zusaetzliches Privileg ausser CHOWN (Modell-Cache).
    # Wenn dies Probleme macht, drop einzelne Caps statt aller.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  chromadb:
    # Server-Version an den chromadb-client (requirements.txt, 1.5.x) angeglichen,
    # um Client/Server-Skew zu vermeiden. Innerhalb 1.x ist das Volume-Format
    # kompatibel; beim 0.x->1.x-Major war es das nicht (persist_path /chroma/chroma
    # -> /data). Vor groesseren Upgrades Backup empfohlen; notfalls den
    # Vektor-Index ueber die System-Wartung neu aufbauen.
    image: chromadb/chroma:1.5.9
    volumes:
      - chromadb-data:/data
    restart: unless-stopped
    # B4: ChromaDB ist NUR ueber das interne chromadb-net erreichbar.
    # Andere Container (Portainer, Watchtower etc.) im default-Netz haben
    # keinen Zugriff auf den ungeschuetzten HTTP-Port.
    networks:
      - chromadb-net
    security_opt:
      - no-new-privileges:true
    # NEW-006: Defense-in-Depth — Rust-Service braucht keine Caps.
    cap_drop:
      - ALL
    healthcheck:
      # chromadb/chroma:1.x ist Rust-basiert, hat weder curl noch python im Image.
      # bash-builtin HTTP-Probe (NEW-009): pruefen dass der Service nicht nur
      # auf Port 8000 lauscht sondern auch /api/v2/heartbeat mit 200 antwortet.
      # Verhindert "TCP listening, API broken"-Phantomgesund-Faelle.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && IFS= read -r -t 2 line <&3 && [[ \"$$line\" == *'200 OK'* ]]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    # nginx laeuft seit N-006 als USER nginx und listen 8080 — keine Caps
    # mehr noetig.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  ollama-models:
  chromadb-data:

# B4: chromadb-net ist ein dediziertes internes Netzwerk fuer den
# Embedding-Store. `internal: true` blockt jeden Egress (kein Internet, kein
# Host-Zugriff) — nur Container die explizit in diesem Netz sind (backend)
# koennen kommunizieren.
networks:
  chromadb-net:
    internal: true
